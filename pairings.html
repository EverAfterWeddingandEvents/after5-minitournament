<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pairings — After 5 Pickleball Club Mini Tournament</title>
  <meta name="description" content="Doubles pairings and pools for the After 5 Pickleball Club 1st Official Mini Tournament.">
  <meta name="theme-color" content="#0b1533">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Oxanium:wght@500;700;800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #0b1533;
      --navy-800: #101d45;
      --navy-700: #16295c;
      --blue-500: #1f6fae;
      --sky-400: #45b4e8;
      --sky-200: #a9defa;
      --white: #ffffff;
      --muted: #b9c8e6;
      --gold: #d9a441;
      --panel: rgba(9, 18, 46, 0.78);
      --line: rgba(169, 222, 250, 0.22);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
      --tech: "Oxanium", "Montserrat", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--white);
      background: var(--navy-900);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { color: var(--navy-900); background: var(--sky-200); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* Same jersey as the home page: navy shoulders fading into sky blue, halftone dots, diagonal panels */
    .jersey {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 18%, var(--navy-700) 40%, var(--blue-500) 68%, var(--sky-400) 100%);
    }
    .jersey::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(8, 16, 42, 0.75) 32%, transparent 34%);
      background-size: 18px 18px;
      -webkit-mask-image: linear-gradient(180deg, transparent 8%, #000 38%, #000 62%, transparent 94%);
              mask-image: linear-gradient(180deg, transparent 8%, #000 38%, #000 62%, transparent 94%);
      pointer-events: none;
    }
    .jersey::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 55%, rgba(255, 255, 255, 0.05) 55%, rgba(255, 255, 255, 0.05) 70%, transparent 70%),
        linear-gradient(245deg, transparent 62%, rgba(255, 255, 255, 0.04) 62%, rgba(255, 255, 255, 0.04) 80%, transparent 80%);
      pointer-events: none;
    }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 0 16px; }

    header { padding: 40px 0 26px; text-align: center; }
    .wordmark { margin: 0; font: 500 2.4rem/1 var(--serif); }
    .club {
      display: inline-block;
      margin: 8px -0.42em 0 0;
      padding-bottom: 7px;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      border-bottom: 2px solid var(--gold);
    }
    h1 {
      margin: 22px 0 0;
      font: 800 clamp(2.4rem, 9vw, 4rem)/1 var(--tech);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-style: italic;
    }
    h1 span { color: var(--gold); }
    .lede { max-width: 520px; margin: 12px auto 0; font-size: 0.95rem; color: var(--muted); text-wrap: pretty; }

    .pool { margin: 0 0 44px; }
    .pool h2 {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 20px;
      font: 800 1.5rem var(--tech);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .pool h2 span { color: var(--gold); }
    .pool h2::before, .pool h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* Flex-wrap keeps every row centred, so an odd last poster sits in the middle */
    .posters { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
    .poster { flex: 0 1 100%; max-width: 440px; min-width: 0; margin: 0; }
    .poster canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      background: var(--navy-800);
      box-shadow: 0 24px 60px rgba(2, 6, 20, 0.5);
    }
    .poster figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .poster figcaption:has(> .btn:only-child) { justify-content: center; }
    .poster figcaption p { margin: 0; min-width: 0; font-size: 0.82rem; color: var(--white); overflow-wrap: anywhere; }

    .btn, .btn-ghost {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      font: 700 0.78rem var(--sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn { color: var(--navy-900); background: linear-gradient(180deg, #ffffff, var(--sky-200)); border: 0; }
    .btn:hover { filter: brightness(1.04); }
    .btn[disabled] { opacity: 0.6; cursor: progress; }
    .btn svg { width: 16px; height: 16px; }
    .btn-ghost { color: var(--white); background: rgba(11, 21, 51, 0.82); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--navy-900); }

    footer { padding: 34px 0 calc(40px + env(safe-area-inset-bottom)); text-align: center; }

    @media (min-width: 760px) {
      .poster { flex-basis: calc((100% - 28px) / 2); }
    }
    @media (min-width: 1240px) {
      main.wrap { max-width: 1400px; }
      .poster { flex-basis: calc((100% - 56px) / 3); }
    }
  </style>
</head>

<body>
  <div class="jersey">
    <header class="wrap">
      <p class="wordmark">After 5</p>
      <span class="club">PICKLEBALL CLUB</span>
      <h1>Pair<span>ings</span></h1>
      <p class="lede">The doubles pairs and pools for the 1st Official Mini Tournament. Find your poster, save it and share it with your partner.</p>
    </header>

    <main class="wrap" id="pools"></main>

    <footer class="wrap">
      <a class="btn-ghost" href="./">Back to the tournament page</a>
    </footer>
  </div>

  <script>
    // The pairs, by pool. To give a player a photo, put the picture in assets/players/ and
    // add its file name, e.g. ["Riza Vergara", "riza-vergara.jpg"]. Without one the poster shows their initials.
    const PHOTO_DIR = "assets/players/";
    const POOLS = {
      A: [
        [["Mc Donald Villaver", "mc-donald-villaver.jpg"], ["Mary Rose Sumalpong", "mary-rose-sumalpong.jpg"]],
        [["Angelita Onido", "angelita-onido.jpg"], ["Stephanie Saraosos", "stephanie-saraosos.jpg"]],
        [["Riza Vergara", "riza-vergara.jpg"], ["Eza Labrador", "eza-labrador.jpg"]],
        [["Claire Dingcong", "claire-dingcong.jpg"], ["Sharon Joy Donguines", "sharon-joy-donguines.jpg"]],
      ],
      B: [
        [["Adonis Rabor", "adonis-rabor.jpg"], ["Chenix Vergara", "chenix-vergara.jpg"]],
        [["Stephanie Mae Lomoljio", "stephanie-mae-lomoljio.jpg"], ["Vanessa Paez", "vanessa-paez.jpg"]],
        [["Nixon Tomaclas", "nixon-tomaclas.jpg"], ["Cheerly Rosal", "cheerly-rosal.jpg"]],
        [["Rommel Torralba", "rommel-torralba.jpg"], ["Giovanna Dingal"]],
      ],
      C: [
        [["Alvs Carreon", "alvs-carreon.jpg"], ["Annalyn Reguya", "annalyn-reguya.jpg"]],
        [["Joseph Vergara", "joseph-vergara.jpg"], ["Lady Marvelou Genon", "lady-marvelou-genon.jpg"]],
        [["John Dave Labita", "john-dave-labita.jpg"], ["Mart Lemmor Torralba", "mart-lemmor-torralba.jpg"]],
        [["Archie Opulentisima", "archie-opulentisima.jpg"], ["Cherry Ann Galleposo", "cherry-ann-galleposo.jpg"]],
      ],
      D: [
        [["Oliver Paez", "oliver-paez.jpg"], ["Mary Lyn Torralba", "mary-lyn-torralba.jpg"]],
        [["Jacob Magno", "jacob-magno.jpg"], ["Hydie Deopita", "hydie-deopita.jpg"]],
        [["Alfie Donguines", "alfie-donguines.jpg"], ["April Mae Diesmo", "april-mae-diesmo.jpg"]],
        [["Landon Vergara", "landon-vergara.jpg"], ["Lynly Ibay", "lynly-ibay.jpg"]],
      ],
    };
    const EVENT_DATE = "15 NOVEMBER, 2026   |   SUNDAY";
    const EVENT_VENUE = "PICKLEBOY, HIGHWAY TURNO, DIPOLOG CITY";

    const W = 1080, H = 1350; // portrait 4:5, the size Facebook and Instagram like
    const C = { navy900: "#0b1533", navy800: "#101d45", navy700: "#16295c", blue: "#1f6fae", sky: "#45b4e8", sky200: "#a9defa", gold: "#d9a441", goldDeep: "#8f6a1f", white: "#ffffff" };
    const TECH = '"Oxanium", "Montserrat", sans-serif';
    const SANS = '"Montserrat", system-ui, sans-serif';
    const SERIF = '"Playfair Display", Georgia, serif';

    // "Stephanie Mae Lomoljio" -> "SL": first and last initial
    function initials(name) {
      const parts = name.trim().split(/\s+/);
      return ((parts[0][0] || "") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
    }

    function loadImage(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    /* ---------- Drawing ---------- */
    function fitText(ctx, text, maxWidth, size, weight, family, min) {
      let s = size;
      do { ctx.font = weight + " " + s + "px " + family; s -= 2; }
      while (ctx.measureText(text).width > maxWidth && s > (min || 20));
    }
    function spaced(ctx, text, x, y, spacing) { // centred text with letter spacing
      if ("letterSpacing" in ctx) {
        ctx.letterSpacing = spacing + "px";
        ctx.fillText(text, x + spacing / 2, y);
        ctx.letterSpacing = "0px";
      } else ctx.fillText(text, x, y);
    }

    function background(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, C.navy900); g.addColorStop(0.18, C.navy800); g.addColorStop(0.4, C.navy700);
      g.addColorStop(0.68, C.blue); g.addColorStop(1, C.sky);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Halftone dots through the middle, fading out at both ends
      for (let y = 12; y < H; y += 24) {
        const t = y / H;
        const a = t < 0.38 ? (t - 0.08) / 0.3 : t > 0.62 ? (0.94 - t) / 0.32 : 1;
        if (a <= 0) continue;
        ctx.fillStyle = "rgba(8, 16, 42, " + (0.7 * Math.min(1, a)).toFixed(3) + ")";
        for (let x = 12; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 6.2832); ctx.fill(); }
      }

      // The jersey's diagonal panels
      ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
      ctx.beginPath(); ctx.moveTo(760, 0); ctx.lineTo(940, 0); ctx.lineTo(310, H); ctx.lineTo(130, H); ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
      ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(360, 0); ctx.lineTo(990, H); ctx.lineTo(780, H); ctx.fill();

      // Darken the bottom so the details stay readable on the sky blue
      const d = ctx.createLinearGradient(0, 820, 0, H);
      d.addColorStop(0, "rgba(11, 21, 51, 0)"); d.addColorStop(0.45, "rgba(11, 21, 51, 0.72)"); d.addColorStop(1, "rgba(11, 21, 51, 0.9)");
      ctx.fillStyle = d;
      ctx.fillRect(0, 820, W, H - 820);
    }

    function pennant(ctx, x, w, top, bottom, light, deep) {
      const tip = 86, mid = x + w / 2;
      const shape = () => {
        ctx.beginPath();
        ctx.moveTo(x, top); ctx.lineTo(x + w, top); ctx.lineTo(x + w, bottom - tip);
        ctx.lineTo(mid, bottom); ctx.lineTo(x, bottom - tip); ctx.closePath();
      };
      ctx.save();
      ctx.shadowColor = "rgba(2, 6, 20, 0.55)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
      const g = ctx.createLinearGradient(0, top, 0, bottom);
      g.addColorStop(0, light); g.addColorStop(0.42, deep); g.addColorStop(1, C.navy900);
      ctx.fillStyle = g;
      shape(); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
      shape(); ctx.stroke();
    }

    function badge(ctx, cx, cy, r, img, fallback, ring) {
      ctx.save();
      ctx.shadowColor = "rgba(2, 6, 20, 0.5)"; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
      ctx.fillStyle = img ? C.white : C.navy900;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
      ctx.restore();
      if (img) {
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, r - 6, 0, 6.2832); ctx.clip();
        const box = (r - 6) * 2; // the photo fills the circle; tall photos keep the top, where the face is
        const k = Math.max(box / img.naturalWidth, box / img.naturalHeight);
        const w = img.naturalWidth * k, h = img.naturalHeight * k;
        ctx.drawImage(img, cx - w / 2, cy - box / 2 - (h - box) * 0.25, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        fitText(ctx, fallback, r * 1.3, r * 0.95, 800, TECH);
        ctx.fillText(fallback, cx, cy + r * 0.04);
      }
      ctx.lineWidth = 8; ctx.strokeStyle = ring;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
    }

    // One partner: photo (or initials) with the name underneath, given names over surname.
    function partner(ctx, x, w, name, img, accent) {
      const mid = x + w / 2, inner = w - 56;
      badge(ctx, mid, 452, 158, img, initials(name), accent);
      const parts = name.trim().split(/\s+/);
      const lines = parts.length > 1 ? [parts.slice(0, -1).join(" "), parts[parts.length - 1]] : [name];
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.white;
      ctx.shadowColor = "rgba(2, 6, 20, 0.6)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
      lines.forEach((line, i) => {
        fitText(ctx, line.toUpperCase(), inner, 54, 800, TECH, 24);
        ctx.fillText(line.toUpperCase(), mid, (lines.length > 1 ? 706 : 738) + i * 64);
      });
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }

    function draw(canvas, pool, pair, photos) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, W, H);
      background(ctx);

      // Club name
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.white;
      ctx.font = "500 76px " + SERIF;
      ctx.fillText("After 5", W / 2, 108);
      ctx.font = "500 22px " + SANS;
      spaced(ctx, "PICKLEBALL CLUB", W / 2, 150, 10);
      ctx.fillStyle = C.gold; ctx.fillRect(W / 2 - 150, 164, 300, 3);
      ctx.fillStyle = C.sky200; ctx.font = "700 22px " + TECH;
      spaced(ctx, "1ST OFFICIAL MINI TOURNAMENT", W / 2, 204, 6);

      // The two partners, side by side in the same colours: they are one team
      pennant(ctx, 60, 440, 236, 900, C.sky, C.blue);
      pennant(ctx, 580, 440, 236, 900, C.sky, C.blue);
      partner(ctx, 60, 440, pair[0][0], photos[0], C.gold);
      partner(ctx, 580, 440, pair[1][0], photos[1], C.gold);

      // The "&" that joins them
      ctx.save();
      ctx.shadowColor = "rgba(2, 6, 20, 0.6)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
      ctx.fillStyle = C.navy900;
      ctx.beginPath(); ctx.arc(W / 2, 452, 62, 0, 6.2832); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 5; ctx.strokeStyle = C.gold;
      ctx.beginPath(); ctx.arc(W / 2, 452, 62, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "500 70px " + SERIF;
      ctx.fillText("&", W / 2, 456);

      // POOL A, slanted like a sports poster
      ctx.save();
      ctx.translate(W / 2, 0);
      ctx.transform(1, 0, -0.18, 1, 0, 0);
      ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(2, 6, 20, 0.65)"; ctx.shadowBlur = 22; ctx.shadowOffsetY = 10;
      ctx.font = "800 190px " + TECH;
      const pw = ctx.measureText("POOL ").width, lw = ctx.measureText(pool).width;
      const x0 = -(pw + lw) / 2 + 190;
      ctx.lineWidth = 14; ctx.strokeStyle = C.navy900;
      ctx.strokeText("POOL", x0, 1090);
      ctx.fillStyle = C.white; ctx.fillText("POOL", x0, 1090);
      ctx.strokeText(pool, x0 + pw, 1090);
      ctx.fillStyle = C.gold; ctx.fillText(pool, x0 + pw, 1090);
      ctx.restore();

      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillStyle = C.sky200; ctx.font = "700 26px " + TECH;
      spaced(ctx, "OFFICIAL DOUBLES PAIRING", W / 2, 1168, 6);
      ctx.fillStyle = C.white;
      fitText(ctx, EVENT_DATE, 940, 34, 700, TECH, 20);
      ctx.fillText(EVENT_DATE, W / 2, 1238);
      fitText(ctx, EVENT_VENUE, 940, 24, 600, SANS, 16);
      ctx.fillText(EVENT_VENUE, W / 2, 1288);
    }

    /* ---------- Page ---------- */
    const fileSafe = (s) => String(s || "").trim().replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
    const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>';

    function poster(pool, pair) {
      const names = pair[0][0] + " & " + pair[1][0];
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", "Pairing poster, Pool " + pool + ": " + names);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn";
      btn.innerHTML = DOWNLOAD_ICON + "<span>Save image</span>";

      const cap = document.createElement("figcaption");
      cap.append(btn);
      const fig = document.createElement("figure");
      fig.className = "poster";
      fig.append(canvas, cap);

      Promise.all(pair.map((p) => loadImage(p[1] ? PHOTO_DIR + p[1] : null)))
        .then((photos) => draw(canvas, pool, pair, photos));

      btn.addEventListener("click", () => {
        btn.disabled = true;
        canvas.toBlob((blob) => {
          btn.disabled = false;
          if (!blob) return;
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "after5-pool-" + pool.toLowerCase() + "-" + (fileSafe(pair[0][0] + "-and-" + pair[1][0]) || "pairing") + ".png";
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }, "image/png");
      });
      return fig;
    }

    (async () => {
      // Canvas text needs the fonts in hand before drawing.
      const fonts = ['800 60px "Oxanium"', '700 30px "Oxanium"', '500 40px "Playfair Display"', '500 22px "Montserrat"', '600 24px "Montserrat"'];
      if (document.fonts) await Promise.all(fonts.map((f) => document.fonts.load(f))).catch(() => { });

      const main = document.getElementById("pools");
      for (const [pool, pairs] of Object.entries(POOLS)) {
        const section = document.createElement("section");
        section.className = "pool";
        const h = document.createElement("h2");
        h.append("Pool ");
        const letter = document.createElement("span");
        letter.textContent = pool;
        h.append(letter);
        const list = document.createElement("div");
        list.className = "posters";
        list.append(...pairs.map((pair) => poster(pool, pair)));
        section.append(h, list);
        main.append(section);
      }
    })();
  </script>
</body>

</html>
