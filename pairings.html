<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pairings — After 5 Pickleball Club Mini Tournament</title>
  <meta name="description" content="Doubles pairings and pools for the After 5 Pickleball Club 1st Official Mini Tournament.">
  <meta name="theme-color" content="#0b1533">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Oxanium:wght@500;700;800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #0b1533;
      --navy-800: #101d45;
      --navy-700: #16295c;
      --blue-500: #1f6fae;
      --sky-400: #45b4e8;
      --sky-200: #a9defa;
      --white: #ffffff;
      --muted: #b9c8e6;
      --gold: #d9a441;
      --panel: rgba(9, 18, 46, 0.78);
      --line: rgba(169, 222, 250, 0.22);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
      --tech: "Oxanium", "Montserrat", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--white);
      background: var(--navy-900);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { color: var(--navy-900); background: var(--sky-200); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* Same jersey as the home page: navy shoulders fading into sky blue, halftone dots, diagonal panels */
    .jersey {
      position: relative;
      overflow: clip; /* clip, not hidden, so the navigation bar can stay stuck to the top */
      min-height: 100vh;
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 18%, var(--navy-700) 40%, var(--blue-500) 68%, var(--sky-400) 100%);
    }
    .jersey::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(8, 16, 42, 0.75) 32%, transparent 34%);
      background-size: 18px 18px;
      -webkit-mask-image: linear-gradient(180deg, transparent 8%, #000 38%, #000 62%, transparent 94%);
              mask-image: linear-gradient(180deg, transparent 8%, #000 38%, #000 62%, transparent 94%);
      pointer-events: none;
    }
    .jersey::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 55%, rgba(255, 255, 255, 0.05) 55%, rgba(255, 255, 255, 0.05) 70%, transparent 70%),
        linear-gradient(245deg, transparent 62%, rgba(255, 255, 255, 0.04) 62%, rgba(255, 255, 255, 0.04) 80%, transparent 80%);
      pointer-events: none;
    }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 0 16px; }

    header { padding: 40px 0 26px; text-align: center; }
    .wordmark { margin: 0; font: 500 2.4rem/1 var(--serif); }
    .club {
      display: inline-block;
      margin: 8px -0.42em 0 0;
      padding-bottom: 7px;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      border-bottom: 2px solid var(--gold);
    }
    h1 {
      margin: 22px 0 0;
      font: 800 clamp(2.4rem, 9vw, 4rem)/1 var(--tech);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-style: italic;
    }
    h1 span { color: var(--gold); }
    .lede { max-width: 520px; margin: 12px auto 0; font-size: 0.95rem; color: var(--muted); text-wrap: pretty; }

    .pool { margin: 0 0 44px; }
    .pool h2 {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 20px;
      font: 800 1.5rem var(--tech);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .pool h2 span { color: var(--gold); }
    .pool h2::before, .pool h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* Flex-wrap keeps every row centred, so an odd last poster sits in the middle */
    .posters { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
    .poster { flex: 0 1 100%; max-width: 440px; min-width: 0; margin: 0; }
    .poster canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      background: var(--navy-800);
      box-shadow: 0 24px 60px rgba(2, 6, 20, 0.5);
    }
    .poster figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .poster figcaption:has(> .btn:only-child) { justify-content: center; }
    .poster figcaption p { margin: 0; min-width: 0; font-size: 0.82rem; color: var(--white); overflow-wrap: anywhere; }

    .btn, .btn-ghost {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      font: 700 0.78rem var(--sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn { color: var(--navy-900); background: linear-gradient(180deg, #ffffff, var(--sky-200)); border: 0; }
    .btn:hover { filter: brightness(1.04); }
    .btn[disabled] { opacity: 0.6; cursor: progress; }
    .btn svg { width: 16px; height: 16px; }
    .btn-ghost { color: var(--white); background: rgba(11, 21, 51, 0.82); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--navy-900); }

    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 34px 16px calc(40px + env(safe-area-inset-bottom)); }

    /* ---------- Cinematic touches: opening bars, drifting light, posters that fade up with a sweep of light ---------- */
    .jersey { isolation: isolate; }
    .wrap { z-index: 2; }

    /* A slow spotlight drifting across the page, and darker edges like a cinema screen */
    .light, .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .light {
      background:
        radial-gradient(42vmax 42vmax at 20% 12%, rgba(169, 222, 250, 0.16), transparent 70%),
        radial-gradient(36vmax 36vmax at 85% 70%, rgba(217, 164, 65, 0.1), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .vignette { background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(4, 8, 24, 0.6) 100%); }
    @keyframes drift {
      from { transform: translate3d(-4%, -2%, 0) scale(1); }
      to { transform: translate3d(6%, 5%, 0) scale(1.12); }
    }

    /* Opening: black bars slide away, then the title comes into focus */
    .bars::before, .bars::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      z-index: 10;
      height: 51vh;
      background: #04081a;
      pointer-events: none;
      animation: open 1.3s cubic-bezier(0.7, 0, 0.2, 1) 0.25s both;
    }
    .bars::before { top: 0; --to: -100%; }
    .bars::after { bottom: 0; --to: 100%; }
    @keyframes open { to { transform: translateY(var(--to)); visibility: hidden; } }

    header > * { animation: focus 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    header .wordmark { animation-delay: 0.9s; }
    header .club { animation-delay: 1.05s; }
    header h1 { animation: title 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) 1.2s both; }
    header .lede { animation-delay: 1.6s; }
    @keyframes focus { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } }
    @keyframes title { from { opacity: 0; transform: scale(1.18); letter-spacing: 0.3em; filter: blur(12px); } }

    /* Pool headings: the rules draw outwards from the name */
    .pool h2 { transition: opacity 0.8s ease, transform 0.8s ease; }
    .pool h2::before, .pool h2::after { transition: transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s; }
    .pool h2::before { transform-origin: right; }
    .pool h2::after { transform-origin: left; }
    .pool:not(.seen) h2 { opacity: 0; transform: translateY(14px); }
    .pool:not(.seen) h2::before, .pool:not(.seen) h2::after { transform: scaleX(0); }

    /* Posters: rise out of the dark, then a band of light sweeps across */
    .poster { transition: opacity 0.9s ease, transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1), filter 0.9s ease; transition-delay: var(--delay, 0s); }
    .poster:not(.seen) { opacity: 0; transform: translateY(46px) scale(0.94); filter: blur(10px) brightness(0.4); }
    .poster .frame { position: relative; overflow: hidden; border-radius: 16px; box-shadow: 0 24px 60px rgba(2, 6, 20, 0.5); transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.5s ease; }
    .poster .frame canvas { box-shadow: none; border-radius: 0; }
    .poster .frame::after {
      content: "";
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: -60%;
      width: 45%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.34), transparent);
      transform: skewX(-18deg);
      pointer-events: none;
    }
    .poster.seen .frame::after { animation: sweep 1.3s ease-out calc(var(--delay, 0s) + 0.55s) both; }
    @keyframes sweep { to { left: 130%; } }
    @media (hover: hover) {
      .poster .frame:hover { transform: translateY(-6px) scale(1.015); box-shadow: 0 34px 80px rgba(2, 6, 20, 0.65); }
    }

    @media (prefers-reduced-motion: reduce) {
      .light, .bars::before, .bars::after, header > *, header h1, .poster.seen .frame::after { animation: none; }
      .bars::before, .bars::after { display: none; }
      .poster, .pool h2, .pool h2::before, .pool h2::after, .poster .frame { transition: none; }
      .poster:not(.seen), .pool:not(.seen) h2 { opacity: 1; transform: none; filter: none; }
      .pool:not(.seen) h2::before, .pool:not(.seen) h2::after { transform: none; }
    }

    @media (min-width: 760px) {
      .poster { flex-basis: calc((100% - 28px) / 2); }
    }
    @media (min-width: 1240px) {
      main.wrap { max-width: 1400px; }
      .poster { flex-basis: calc((100% - 56px) / 3); }
    }

    /* ---------- Navigation bar (the same on the Pairings and Live pages) ---------- */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 56px;
      padding: 6px max(14px, calc((100% - 1100px) / 2));
      padding-top: calc(6px + env(safe-area-inset-top));
      background: rgba(11, 21, 51, 0.92);
      -webkit-backdrop-filter: blur(10px);
              backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .site-nav .brand { display: inline-flex; align-items: center; min-height: 44px; font: 500 1.35rem/1 var(--serif); color: var(--white); text-decoration: none; white-space: nowrap; }
    .site-nav .links { display: flex; gap: 4px; }
    .site-nav .links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      padding: 8px 12px;
      font: 700 0.74rem var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--white);
      border-radius: 999px;
    }
    .site-nav .links a:hover { background: rgba(255, 255, 255, 0.1); }
    .site-nav .links a[aria-current="page"] { color: var(--navy-900); background: linear-gradient(180deg, #ffffff, var(--sky-200)); }
    .site-nav .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5fe08a; }
    .site-nav a[aria-current="page"] .live-dot { background: #1c8a45; }
    @media (min-width: 560px) { .site-nav .links a { padding: 8px 16px; font-size: 0.78rem; } }
  </style>
</head>

<body>
  <div class="jersey">
    <nav class="site-nav" aria-label="Site">
      <a class="brand" href="./" aria-label="After 5 Pickleball Club, home">After 5</a>
      <div class="links">
        <a href="./">Home</a>
        <a href="pairings.html" aria-current="page">Pairings</a>
        <a href="live.html"><span class="live-dot" aria-hidden="true"></span>Live</a>
      </div>
    </nav>
    <div class="light" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="bars" aria-hidden="true"></div>
    <header class="wrap">
      <p class="wordmark">After 5</p>
      <span class="club">PICKLEBALL CLUB</span>
      <h1>Pair<span>ings</span></h1>
      <p class="lede">The doubles pairs and pools for the 1st Official Mini Tournament. Find your poster, save it and share it with your partner.</p>
    </header>

    <main class="wrap" id="pools"></main>

    <footer class="wrap">
      <a class="btn-ghost" href="live.html">Live scores</a>
      <a class="btn-ghost" href="./">Back to the tournament page</a>
    </footer>
  </div>

  <script>
    // The pairs, by pool. To give a player a photo, put the picture in assets/players/ and
    // add its file name, e.g. ["Riza Vergara", "riza-vergara.jpg"]. Without one the poster shows their initials.
    const PHOTO_DIR = "assets/players/";
    const POOLS = {
      A: [
        [["Mc Donald Villaver", "mc-donald-villaver.jpg"], ["Mary Rose Sumalpong", "mary-rose-sumalpong.jpg"]],
        [["Angelita Onido", "angelita-onido.jpg"], ["Stephanie Saraosos", "stephanie-saraosos.jpg"]],
        [["Riza Vergara", "riza-vergara.jpg"], ["Eza Labrador", "eza-labrador.jpg"]],
        [["Claire Dingcong", "claire-dingcong.jpg"], ["Sharon Joy Donguines", "sharon-joy-donguines.jpg"]],
      ],
      B: [
        [["Adonis Rabor", "adonis-rabor.jpg"], ["Chenix Vergara", "chenix-vergara.jpg"]],
        [["Stephanie Mae Lomoljio", "stephanie-mae-lomoljio.jpg"], ["Vanessa Paez", "vanessa-paez.jpg"]],
        [["Nixon Tomaclas", "nixon-tomaclas.jpg"], ["Cheerly Rosal", "cheerly-rosal.jpg"]],
        [["Rommel Torralba", "rommel-torralba.jpg"], ["Giovanna Dingal", "giovanna-dingal.jpg"]],
      ],
      C: [
        [["Alvs Carreon", "alvs-carreon.jpg"], ["Annalyn Reguya", "annalyn-reguya.jpg"]],
        [["Joseph Vergara", "joseph-vergara.jpg"], ["Lady Marvelou Genon", "lady-marvelou-genon.jpg"]],
        [["John Dave Labita", "john-dave-labita.jpg"], ["Mart Lemmor Torralba", "mart-lemmor-torralba.jpg"]],
        [["Archie Opulentisima", "archie-opulentisima.jpg"], ["Cherry Ann Galleposo", "cherry-ann-galleposo.jpg"]],
      ],
      D: [
        [["Oliver Paez", "oliver-paez.jpg"], ["Mary Lyn Torralba", "mary-lyn-torralba.jpg"]],
        [["Jacob Magno", "jacob-magno.jpg"], ["Hydie Deopita", "hydie-deopita.jpg"]],
        [["Alfie Donguines", "alfie-donguines.jpg"], ["April Mae Diesmo", "april-mae-diesmo.jpg"]],
        [["Landon Vergara", "landon-vergara.jpg"], ["Lynlie Ibay", "lynlie-ibay.jpg"]],
      ],
    };
    const EVENT = { date: "15 NOVEMBER, 2026", time: "12:00 NN", day: "SUNDAY", venue: "PICKLEBOY", address: "HIGHWAY TURNO, DIPOLOG CITY, ZAMBOANGA DEL NORTE" };

    const W = 1080, H = 1350; // portrait 4:5, the size Facebook and Instagram like
    const C = { navy900: "#0b1533", navy800: "#101d45", navy700: "#16295c", blue: "#1f6fae", sky: "#45b4e8", sky200: "#a9defa", gold: "#d9a441", white: "#ffffff" };
    const TECH = '"Oxanium", "Montserrat", sans-serif';
    const SANS = '"Montserrat", system-ui, sans-serif';
    const SERIF = '"Playfair Display", Georgia, serif';

    // "Stephanie Mae Lomoljio" -> "SL": first and last initial
    function initials(name) {
      const parts = name.trim().split(/\s+/);
      return ((parts[0][0] || "") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
    }

    function loadImage(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    /* ---------- Drawing ---------- */
    function fitText(ctx, text, maxWidth, size, weight, family, min) {
      let s = size;
      do { ctx.font = weight + " " + s + "px " + family; s -= 2; }
      while (ctx.measureText(text).width > maxWidth && s > (min || 20));
    }
    function spaced(ctx, text, x, y, spacing) { // centred text with letter spacing
      if ("letterSpacing" in ctx) {
        ctx.letterSpacing = spacing + "px";
        ctx.fillText(text, x + spacing / 2, y);
        ctx.letterSpacing = "0px";
      } else ctx.fillText(text, x, y);
    }

    // The club emblem from the home page: crossed paddles behind the 5 o'clock clock, with the gold ball.
    const PADDLE = '<rect x="-4.5" y="-24" width="9" height="52" rx="3" fill="#101d45"/><path d="M-4.5 6h9M-4.5 13h9M-4.5 20h9"/>'
      + '<rect x="-22" y="-90" width="44" height="64" rx="19" fill="#101d45"/><rect x="-15.5" y="-83.5" width="31" height="51" rx="13" opacity="0.45"/>';
    const EMBLEM = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="424" height="300" viewBox="-6 -4 212 150" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">'
      + '<g stroke-width="2.4" transform="translate(100 108) rotate(-54)">' + PADDLE + '</g>'
      + '<g stroke-width="2.4" transform="translate(100 108) rotate(54)">' + PADDLE + '</g>'
      + '<g transform="translate(57 8) scale(0.86)"><circle cx="50" cy="50" r="49" fill="#0b1533" stroke="none"/><circle cx="50" cy="50" r="46" stroke-width="2.5"/>'
      + '<circle cx="50" cy="50" r="38" stroke-width="5" stroke-linecap="butt" stroke-dasharray="1.4 18.497" stroke-dashoffset="0.7"/>'
      + '<line x1="50" y1="50" x2="50" y2="22" stroke-width="2.5"/><line x1="50" y1="50" x2="60.5" y2="68.2" stroke-width="3.5"/><circle cx="50" cy="50" r="2.5" fill="#fff" stroke="none"/></g>'
      + '<g transform="translate(158 124) scale(1.15)"><circle r="10" fill="#d9a441" stroke="none"/><g fill="#0b1533" stroke="none">'
      + '<circle cx="-4" cy="-3.5" r="1.6"/><circle cx="3" cy="-5" r="1.6"/><circle cx="5" cy="2" r="1.6"/><circle cx="-2" cy="4.5" r="1.6"/><circle cx="-6" cy="2.5" r="1.3"/><circle cx="0.5" cy="-0.5" r="1.6"/></g></g></svg>');
    const emblemReady = loadImage(EMBLEM);

    // The site's jersey: navy shoulders fading into sky blue, halftone dots, and diagonal panels that split the two partners.
    function background(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, C.navy900); g.addColorStop(0.18, C.navy800); g.addColorStop(0.4, C.navy700);
      g.addColorStop(0.68, C.blue); g.addColorStop(1, C.sky);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      for (let y = 12; y < H; y += 24) {
        const t = y / H;
        const a = t < 0.38 ? (t - 0.08) / 0.3 : t > 0.62 ? (0.94 - t) / 0.32 : 1;
        if (a <= 0) continue;
        ctx.fillStyle = "rgba(8, 16, 42, " + (0.7 * Math.min(1, a)).toFixed(3) + ")";
        for (let x = 12; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 6.2832); ctx.fill(); }
      }

      // Diagonal panels: sky on the left, gold on the right, crossing behind the photos
      ctx.fillStyle = "rgba(69, 180, 232, 0.16)";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(430, 0); ctx.lineTo(640, 520); ctx.lineTo(300, H); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = "rgba(217, 164, 65, 0.07)";
      ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(650, 0); ctx.lineTo(440, 520); ctx.lineTo(780, H); ctx.lineTo(W, H); ctx.fill();
      ctx.lineWidth = 3; ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(169, 222, 250, 0.4)";
      ctx.beginPath(); ctx.moveTo(-20, 150); ctx.lineTo(300, 700); ctx.lineTo(-20, 1250); ctx.stroke();
      ctx.strokeStyle = "rgba(217, 164, 65, 0.45)";
      ctx.beginPath(); ctx.moveTo(W + 20, 150); ctx.lineTo(W - 300, 700); ctx.lineTo(W + 20, 1250); ctx.stroke();

      // Darken the bottom so the title and details stay readable on the sky blue
      const d = ctx.createLinearGradient(0, 740, 0, H);
      d.addColorStop(0, "rgba(11, 21, 51, 0)"); d.addColorStop(0.35, "rgba(11, 21, 51, 0.8)"); d.addColorStop(1, "rgba(11, 21, 51, 0.93)");
      ctx.fillStyle = d; ctx.fillRect(0, 740, W, H - 740);
    }

    function slant(ctx, x, y, w, h, k) { // a box leaning to the right by k pixels
      ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + w + k, y); ctx.lineTo(x + w - k, y + h); ctx.lineTo(x - k, y + h); ctx.closePath();
    }

    // The photo band: each partner fills one half, edge to edge, meeting at a slanted gold line.
    const BAND = { top: 232, bottom: 806, splitTop: 578, splitBottom: 502 };

    // One partner's half of the band (their initials if there is no photo), graded towards the poster's colours.
    function half(ctx, side, img, name, rgb) {
      const { top, bottom, splitTop, splitBottom } = BAND;
      const left = side === "left";
      const x0 = left ? 0 : splitBottom, x1 = left ? splitTop : W, bw = x1 - x0, bh = bottom - top;
      ctx.save();
      ctx.beginPath();
      if (left) { ctx.moveTo(0, top); ctx.lineTo(splitTop, top); ctx.lineTo(splitBottom, bottom); ctx.lineTo(0, bottom); }
      else { ctx.moveTo(splitTop, top); ctx.lineTo(W, top); ctx.lineTo(W, bottom); ctx.lineTo(splitBottom, bottom); }
      ctx.closePath(); ctx.clip();
      ctx.fillStyle = C.navy800; ctx.fillRect(x0, top, bw, bh);
      if (img) {
        const k = Math.max(bw / img.naturalWidth, bh / img.naturalHeight);
        const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
        ctx.drawImage(img, x0 + (bw - iw) / 2, top - (ih - bh) * 0.3, iw, ih); // keep the top of the photo, where the face is
      } else {
        ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "800 210px " + TECH;
        ctx.fillText(initials(name), x0 + bw / 2, top + bh * 0.42);
      }
      // Grade: a little navy over everything, a wash of the side's colour from the outer edge, darker top and bottom
      ctx.fillStyle = "rgba(11, 21, 51, 0.16)"; ctx.fillRect(x0, top, bw, bh);
      let g = ctx.createLinearGradient(left ? 0 : W, 0, left ? splitTop : splitBottom, 0);
      g.addColorStop(0, "rgba(" + rgb + ", 0.42)"); g.addColorStop(0.55, "rgba(" + rgb + ", 0.1)"); g.addColorStop(1, "rgba(" + rgb + ", 0)");
      ctx.fillStyle = g; ctx.fillRect(x0, top, bw, bh);
      g = ctx.createLinearGradient(0, top, 0, bottom);
      g.addColorStop(0, "rgba(11, 21, 51, 0.5)"); g.addColorStop(0.16, "rgba(11, 21, 51, 0)");
      g.addColorStop(0.6, "rgba(11, 21, 51, 0)"); g.addColorStop(1, "rgba(11, 21, 51, 0.96)");
      ctx.fillStyle = g; ctx.fillRect(x0, top, bw, bh);
      ctx.restore();
    }

    function band(ctx, pair, photos) {
      const { top, bottom, splitTop, splitBottom } = BAND;
      half(ctx, "left", photos[0], pair[0][0], "69, 180, 232");
      half(ctx, "right", photos[1], pair[1][0], "217, 164, 65");
      // Glowing edges: sky over the left half, gold over the right, and a bright split between them
      glow(ctx, [[0, top - 3], [splitTop, top - 3]], "69, 180, 232", 5);
      glow(ctx, [[splitTop, top - 3], [W, top - 3]], "217, 164, 65", 5);
      glow(ctx, [[W - 330, bottom - 4], [W, bottom - 4]], "217, 164, 65", 3);
      glow(ctx, [[0, bottom - 4], [250, bottom - 4]], "69, 180, 232", 3);
      glow(ctx, [[splitTop, top - 3], [splitBottom + 14, bottom - 110]], "240, 170, 50", 10);
      flare(ctx, splitTop, top - 3, 90, "255, 200, 110");
    }

    // A line of light: soft wide glow, tighter glow, white-hot core. Added to what is underneath, like real light.
    function glow(ctx, pts, rgb, width) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      const line = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]); ctx.stroke(); };
      ctx.shadowColor = "rgba(" + rgb + ", 0.9)";
      ctx.shadowBlur = width * 5; ctx.strokeStyle = "rgba(" + rgb + ", 0.55)"; ctx.lineWidth = width; line();
      ctx.shadowBlur = width * 2; ctx.strokeStyle = "rgba(" + rgb + ", 0.9)"; ctx.lineWidth = width * 0.6; line();
      ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(255, 240, 200, 0.75)"; ctx.lineWidth = Math.max(1.5, width * 0.22); line();
      ctx.restore();
    }

    function flare(ctx, x, y, r, rgb) { // a soft burst of light with a thin horizontal streak
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      let g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(255, 255, 255, 0.7)"); g.addColorStop(0.15, "rgba(" + rgb + ", 0.4)"); g.addColorStop(1, "rgba(" + rgb + ", 0)");
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      g = ctx.createLinearGradient(x - r * 2.2, 0, x + r * 2.2, 0);
      g.addColorStop(0, "rgba(" + rgb + ", 0)"); g.addColorStop(0.5, "rgba(255, 255, 255, 0.8)"); g.addColorStop(1, "rgba(" + rgb + ", 0)");
      ctx.fillStyle = g; ctx.fillRect(x - r * 2.2, y - 1.5, r * 4.4, 3);
      ctx.restore();
    }

    // Sparks and dust thrown off the split. The same seed every time, so a poster always looks the same.
    function sparks(ctx, seed) {
      let t = seed >>> 0;
      const rnd = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
      const { top, bottom, splitTop, splitBottom } = BAND;
      const onSplit = (v) => splitTop + (splitBottom - splitTop) * v;

      // dark dust hugging the split
      ctx.save();
      for (let i = 0; i < 260; i++) {
        const v = rnd(), spread = (rnd() - 0.5) * (rnd() < 0.75 ? 110 : 220);
        ctx.fillStyle = "rgba(6, 12, 32, " + (0.35 + rnd() * 0.5).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(onSplit(v) + spread, top + (bottom - top) * v + (rnd() - 0.5) * 30, 0.8 + rnd() * 2.6, 0, 6.2832); ctx.fill();
      }
      ctx.restore();

      // bright shards, kept off the faces: along the split, down the outer edges and across the bottom of the band
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 170; i++) {
        const zone = rnd();
        let x, y, side;
        if (zone < 0.4) { // hugging the split
          const v = 0.1 + rnd() * 0.9; side = rnd() < 0.6 ? 1 : -1;
          x = onSplit(v) + side * (8 + Math.pow(rnd(), 2) * 120); y = top + (bottom - top) * v;
        } else if (zone < 0.8) { // rising from the bottom of the band
          x = rnd() * W; side = x > splitBottom ? 1 : -1;
          y = bottom - Math.pow(rnd(), 2.2) * 230 + 20;
        } else { // the outer edges and the header
          side = rnd() < 0.5 ? 1 : -1;
          x = side > 0 ? W - rnd() * 130 : rnd() * 130; y = 30 + rnd() * (bottom - 30);
        }
        const gold = side > 0 ? rnd() < 0.9 : rnd() < 0.3;
        const rgb = gold ? "255, " + Math.round(165 + rnd() * 60) + ", " + Math.round(50 + rnd() * 60) : "110, 200, 255";
        const len = 3 + rnd() * rnd() * 20, w = 0.8 + rnd() * 2.2, ang = -0.9 + rnd() * 1.1;
        ctx.save();
        ctx.translate(x, y); ctx.rotate(ang);
        ctx.shadowColor = "rgba(" + rgb + ", 0.95)"; ctx.shadowBlur = 8 + w * 3;
        ctx.fillStyle = "rgba(" + rgb + ", " + (0.5 + rnd() * 0.45).toFixed(2) + ")";
        ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(0, -w); ctx.lineTo(len / 2, 0); ctx.lineTo(0, w); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function ball(ctx, cx, cy, r) {
      // motion trail: streaks of light behind the ball, then a glow around it
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      [[-0.55, 250, 0.55], [-0.15, 300, 0.75], [0.3, 230, 0.5]].forEach(([dy, len, a]) => {
        const y = cy + dy * r, g = ctx.createLinearGradient(cx - len, 0, cx, 0);
        g.addColorStop(0, "rgba(255, 200, 90, 0)"); g.addColorStop(1, "rgba(255, 215, 120, " + a + ")");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(cx - len, y + 10); ctx.lineTo(cx, y - r * 0.28); ctx.lineTo(cx, y + r * 0.28); ctx.closePath(); ctx.fill();
      });
      const halo = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 2.3);
      halo.addColorStop(0, "rgba(255, 215, 120, 0.6)"); halo.addColorStop(1, "rgba(255, 200, 90, 0)");
      ctx.fillStyle = halo; ctx.fillRect(cx - r * 2.3, cy - r * 2.3, r * 4.6, r * 4.6);
      ctx.restore();
      ctx.save();
      ctx.shadowColor = "rgba(2, 6, 20, 0.6)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
      const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
      g.addColorStop(0, "#fff3c4"); g.addColorStop(0.5, "#f2c14e"); g.addColorStop(1, "#a8791f");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#6b4a10";
      [[-0.45, -0.3], [0.1, -0.5], [0.5, -0.1], [-0.15, 0.05], [0.3, 0.4], [-0.5, 0.35], [-0.1, 0.6]].forEach(([dx, dy]) => {
        ctx.beginPath(); ctx.ellipse(cx + dx * r, cy + dy * r, r * 0.13, r * 0.11, 0, 0, 6.2832); ctx.fill();
      });
    }

    // Name plate: a slanted outlined box with the name inside
    function plate(ctx, x, y, w, h, name, color) {
      ctx.save();
      const fill = ctx.createLinearGradient(0, y, 0, y + h);
      fill.addColorStop(0, "#1c2f66"); fill.addColorStop(0.5, "#0e1a3f"); fill.addColorStop(1, "#0a1330");
      ctx.shadowColor = color; ctx.shadowBlur = 26;
      ctx.fillStyle = fill;
      slant(ctx, x, y, w, h, 12); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = color; ctx.lineJoin = "round";
      slant(ctx, x, y, w, h, 12); ctx.stroke();
      ctx.shadowBlur = 0; ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
      slant(ctx, x, y, w, h, 12); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.transform(1, 0, -0.14, 1, (y + h / 2) * 0.14, 0);
      ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      fitText(ctx, name.toUpperCase(), w - 40, 40, 800, TECH, 20);
      ctx.fillText(name.toUpperCase(), x + w / 2, y + h / 2 + 2);
      ctx.restore();
    }

    // Small gold line icons for the details row; (x, y) is the icon's centre
    function icon(ctx, kind, x, y) {
      ctx.save();
      ctx.strokeStyle = C.gold; ctx.fillStyle = C.gold; ctx.lineWidth = 3.4; ctx.lineJoin = "round"; ctx.lineCap = "round";
      if (kind === "calendar") {
        ctx.strokeRect(x - 16, y - 12, 32, 27);
        ctx.beginPath(); ctx.moveTo(x - 16, y - 3); ctx.lineTo(x + 16, y - 3); ctx.moveTo(x - 8, y - 17); ctx.lineTo(x - 8, y - 9); ctx.moveTo(x + 8, y - 17); ctx.lineTo(x + 8, y - 9); ctx.stroke();
      } else if (kind === "clock") {
        ctx.beginPath(); ctx.arc(x, y, 16, 0, 6.2832); ctx.moveTo(x, y - 9); ctx.lineTo(x, y); ctx.lineTo(x + 7, y + 4); ctx.stroke();
      } else { // pin
        ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.bezierCurveTo(x - 18, y - 2, x - 14, y - 18, x, y - 18); ctx.bezierCurveTo(x + 14, y - 18, x + 18, y - 2, x, y + 18); ctx.fill();
        ctx.fillStyle = C.navy900; ctx.beginPath(); ctx.arc(x, y - 5, 5, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }

    function draw(canvas, pool, pair, photos, emblem) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, W, H);
      background(ctx);

      // Club emblem and name
      if (emblem) ctx.drawImage(emblem, W / 2 - 78, 14, 156, 110);
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.white;
      ctx.shadowColor = "rgba(2, 6, 20, 0.7)"; ctx.shadowBlur = 16;
      ctx.font = "500 66px " + SERIF;
      ctx.fillText("After 5", W / 2, 178);
      ctx.font = "600 19px " + SANS;
      spaced(ctx, "PICKLEBALL CLUB", W / 2, 210, 10);
      ctx.shadowBlur = 0;

      // The two partners
      band(ctx, pair, photos);
      sparks(ctx, 20261115);

      // Title: MATCH over a PAIRING plate, with the ball above and two swooshes around
      ctx.save();
      ctx.lineWidth = 4;
      ctx.shadowBlur = 18;
      ctx.shadowColor = C.sky; ctx.strokeStyle = C.sky;
      ctx.beginPath(); ctx.ellipse(W / 2 - 20, 880, 420, 92, -0.08, 2.2, 5.2); ctx.stroke();
      ctx.shadowColor = C.gold; ctx.strokeStyle = C.gold;
      ctx.beginPath(); ctx.ellipse(W / 2 + 20, 880, 420, 92, -0.08, 5.6, 8.2); ctx.stroke();
      ctx.restore();
      ball(ctx, W / 2 + 6, 752, 50);

      ctx.save();
      ctx.translate(W / 2, 0);
      ctx.transform(1, 0, -0.2, 1, 0, 0);
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.lineJoin = "round";
      ctx.font = "800 172px " + TECH;
      ctx.shadowColor = "rgba(2, 6, 20, 0.8)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 10;
      ctx.lineWidth = 16; ctx.strokeStyle = C.navy900; ctx.strokeText("MATCH", 178, 900);
      const mg = ctx.createLinearGradient(0, 780, 0, 900);
      mg.addColorStop(0, "#ffffff"); mg.addColorStop(1, C.sky200);
      ctx.fillStyle = mg; ctx.fillText("MATCH", 178, 900);
      // PAIRING plate: polished gold with a bright top edge
      const pg = ctx.createLinearGradient(0, 912, 0, 1020);
      pg.addColorStop(0, "#fff0b8"); pg.addColorStop(0.18, "#f3c552"); pg.addColorStop(0.55, "#d9a441"); pg.addColorStop(1, "#9c6f1c");
      ctx.shadowColor = "rgba(255, 200, 90, 0.55)"; ctx.shadowBlur = 34; ctx.shadowOffsetY = 0;
      ctx.fillStyle = pg; ctx.fillRect(-60, 912, 500, 108);
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255, 250, 225, 0.9)"; ctx.lineWidth = 3; ctx.lineJoin = "miter";
      ctx.strokeRect(-54, 918, 488, 96);
      ctx.fillStyle = "rgba(255, 255, 255, 0.28)"; ctx.fillRect(-54, 918, 488, 30);
      ctx.fillStyle = C.navy900; ctx.font = "800 104px " + TECH;
      ctx.fillText("PAIRING", 192, 1003);
      ctx.restore();

      // Pool
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillStyle = C.gold; ctx.font = "800 30px " + TECH;
      spaced(ctx, "POOL " + pool, W / 2, 1066, 10);
      [[W / 2 - 300, W / 2 - 120], [W / 2 + 300, W / 2 + 120]].forEach(([from, to]) => {
        const lg = ctx.createLinearGradient(from, 0, to, 0);
        lg.addColorStop(0, "rgba(217, 164, 65, 0)"); lg.addColorStop(1, C.gold);
        ctx.fillStyle = lg; ctx.fillRect(Math.min(from, to), 1055, 180, 2);
      });

      // Names
      plate(ctx, 96, 1092, 390, 74, pair[0][0], C.sky);
      plate(ctx, 594, 1092, 390, 74, pair[1][0], C.gold);
      ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "500 56px " + SERIF;
      ctx.fillText("&", W / 2, 1131);

      // Date | call time | day
      ctx.font = "700 27px " + TECH; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      const bits = [["calendar", EVENT.date], ["clock", EVENT.time], ["calendar", EVENT.day]];
      const gap = 44, iw = 50;
      const widths = bits.map((b) => iw + ctx.measureText(b[1]).width);
      let x = (W - widths.reduce((a, b) => a + b, 0) - gap * 2 * (bits.length - 1)) / 2;
      bits.forEach((b, i) => {
        icon(ctx, b[0], x + 17, 1218);
        ctx.fillStyle = C.white; ctx.fillText(b[1], x + iw, 1220);
        x += widths[i] + gap;
        if (i < bits.length - 1) { ctx.fillStyle = "rgba(255, 255, 255, 0.6)"; ctx.fillRect(x, 1202, 2, 34); x += gap; }
      });

      // Venue
      ctx.font = "800 28px " + TECH; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      icon(ctx, "pin", W / 2 - ctx.measureText(EVENT.venue).width / 2 - 30, 1272);
      ctx.fillStyle = C.gold;
      ctx.fillText(EVENT.venue, W / 2, 1283);
      ctx.fillStyle = C.sky200; ctx.font = "600 19px " + SANS;
      spaced(ctx, EVENT.address, W / 2, 1318, 2);
    }

    /* ---------- Page ---------- */
    const fileSafe = (s) => String(s || "").trim().replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
    const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>';

    function poster(pool, pair) {
      const names = pair[0][0] + " & " + pair[1][0];
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", "Pairing poster, Pool " + pool + ": " + names);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn";
      btn.innerHTML = DOWNLOAD_ICON + "<span>Save image</span>";

      const cap = document.createElement("figcaption");
      cap.append(btn);
      const fig = document.createElement("figure");
      fig.className = "poster";
      const frame = document.createElement("div");
      frame.className = "frame";
      frame.append(canvas);
      fig.append(frame, cap);

      Promise.all([emblemReady, ...pair.map((p) => loadImage(p[1] ? PHOTO_DIR + p[1] : null))])
        .then(([emblem, ...photos]) => draw(canvas, pool, pair, photos, emblem));

      btn.addEventListener("click", () => {
        btn.disabled = true;
        canvas.toBlob((blob) => {
          btn.disabled = false;
          if (!blob) return;
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "after5-pool-" + pool.toLowerCase() + "-" + (fileSafe(pair[0][0] + "-and-" + pair[1][0]) || "pairing") + ".png";
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }, "image/png");
      });
      return fig;
    }

    (async () => {
      // Canvas text needs the fonts in hand before drawing.
      const fonts = ['800 60px "Oxanium"', '700 30px "Oxanium"', '500 40px "Playfair Display"', '500 22px "Montserrat"', '600 24px "Montserrat"'];
      if (document.fonts) await Promise.all(fonts.map((f) => document.fonts.load(f))).catch(() => { });

      const main = document.getElementById("pools");
      for (const [pool, pairs] of Object.entries(POOLS)) {
        const section = document.createElement("section");
        section.className = "pool";
        const h = document.createElement("h2");
        h.append("Pool ");
        const letter = document.createElement("span");
        letter.textContent = pool;
        h.append(letter);
        const list = document.createElement("div");
        list.className = "posters";
        list.append(...pairs.map((pair) => poster(pool, pair)));
        section.append(h, list);
        main.append(section);
        [...list.children].forEach((fig, i) => fig.style.setProperty("--delay", (i % 3) * 0.14 + "s"));
      }

      // Reveal each pool heading and poster as it scrolls into view.
      const targets = document.querySelectorAll(".pool, .poster");
      if (!("IntersectionObserver" in window)) { targets.forEach((t) => t.classList.add("seen")); return; }
      const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("seen"); seen.unobserve(e.target); }
      }), { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
      targets.forEach((t) => seen.observe(t));
    })();
  </script>
</body>
