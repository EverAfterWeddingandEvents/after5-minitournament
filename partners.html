<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tournament Partners — After 5 Pickleball Club Mini Tournament</title>
  <meta name="description" content="Tournament Partners poster for the After 5 Pickleball Club 1st Official Mini Tournament.">
  <meta name="theme-color" content="#0b1533">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Oxanium:wght@500;700;800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #0b1533;
      --navy-800: #101d45;
      --navy-700: #16295c;
      --blue-500: #1f6fae;
      --sky-400: #45b4e8;
      --sky-200: #a9defa;
      --white: #ffffff;
      --muted: #b9c8e6;
      --gold: #d9a441;
      --panel: rgba(9, 18, 46, 0.78);
      --line: rgba(169, 222, 250, 0.22);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
      --tech: "Oxanium", "Montserrat", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--white);
      background: var(--navy-900);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { color: var(--navy-900); background: var(--sky-200); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* Same jersey as the home page: navy shoulders fading into sky blue, halftone dots, diagonal panels */
    .jersey {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 18%, var(--navy-700) 40%, var(--blue-500) 68%, var(--sky-400) 100%);
    }
    .jersey::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(8, 16, 42, 0.75) 32%, transparent 34%);
      background-size: 18px 18px;
      -webkit-mask-image: linear-gradient(180deg, transparent 8%, #000 38%, #000 62%, transparent 94%);
              mask-image: linear-gradient(180deg, transparent 8%, #000 38%, #000 62%, transparent 94%);
      pointer-events: none;
    }
    .jersey::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 55%, rgba(255, 255, 255, 0.05) 55%, rgba(255, 255, 255, 0.05) 70%, transparent 70%),
        linear-gradient(245deg, transparent 62%, rgba(255, 255, 255, 0.04) 62%, rgba(255, 255, 255, 0.04) 80%, transparent 80%);
      pointer-events: none;
    }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 0 16px; }

    header { padding: 40px 0 26px; text-align: center; }
    .wordmark { margin: 0; font: 500 2.4rem/1 var(--serif); }
    .club {
      display: inline-block;
      margin: 8px -0.42em 0 0;
      padding-bottom: 7px;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      border-bottom: 2px solid var(--gold);
    }
    h1 {
      margin: 22px 0 0;
      font: 800 clamp(2.4rem, 9vw, 4rem)/1 var(--tech);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-style: italic;
    }
    h1 span { color: var(--gold); }
    .lede { max-width: 520px; margin: 12px auto 0; font-size: 0.95rem; color: var(--muted); text-wrap: pretty; }

    .notice {
      max-width: 620px;
      margin: 0 auto 20px;
      padding: 12px 16px;
      font-size: 0.88rem;
      text-align: center;
      color: var(--sky-200);
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 14px;
    }

    /* Flex-wrap keeps every row centred, so an odd last poster sits in the middle */
    .posters { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
    .poster { flex: 0 1 100%; max-width: 440px; min-width: 0; margin: 0; }
    .poster canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      border-radius: 16px;
      background: var(--navy-800);
      box-shadow: 0 24px 60px rgba(2, 6, 20, 0.5);
    }
    .poster figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .poster figcaption:has(> .btn:only-child) { justify-content: center; }
    .poster figcaption p { margin: 0; min-width: 0; font-size: 0.82rem; color: var(--white); overflow-wrap: anywhere; }

    .btn, .btn-ghost {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      font: 700 0.78rem var(--sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn { color: var(--navy-900); background: linear-gradient(180deg, #ffffff, var(--sky-200)); border: 0; }
    .btn:hover { filter: brightness(1.04); }
    .btn[disabled] { opacity: 0.6; cursor: progress; }
    .btn svg { width: 16px; height: 16px; }
    .btn-ghost { color: var(--white); background: rgba(11, 21, 51, 0.82); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--navy-900); }

    footer { padding: 34px 0 calc(40px + env(safe-area-inset-bottom)); text-align: center; }

    @media (min-width: 760px) {
      .poster { flex-basis: calc((100% - 28px) / 2); }
    }
    @media (min-width: 1240px) {
      main.wrap { max-width: 1400px; }
      .poster { flex-basis: calc((100% - 56px) / 3); }
    }
  </style>
</head>

<body>
  <div class="jersey">
    <header class="wrap">
      <p class="wordmark">After 5</p>
      <span class="club">PICKLEBALL CLUB</span>
      <h1>Tournament <span>Partners</span></h1>
      <p class="lede">Thank you to the sponsors who make the 1st Official Mini Tournament possible. Save the poster and share it.</p>
    </header>

    <main class="wrap">
      <div class="posters">
        <figure class="poster">
          <canvas id="poster" width="1080" height="1620" role="img"
            aria-label="Tournament Partners poster listing the Platinum, Gold and Silver sponsors of the After 5 Pickleball Club 1st Official Mini Tournament"></canvas>
          <figcaption>
            <button class="btn" type="button" id="save" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>
              <span>Save image</span>
            </button>
          </figcaption>
        </figure>
      </div>
    </main>

    <footer class="wrap">
      <a class="btn-ghost" href="./">Back to the tournament page</a>
    </footer>
  </div>

  <script>
    // The sponsors, in the same order and tiers as the Tournament Partners section of index.html.
    // "fit" says how the image sits in its tile: contain (white tile, padded), dark (black tile) or fill (edge to edge).
    // A sponsor with no "img" is listed by name only.
    const DIR = "assets/sponsors/";
    const TIERS = {
      platinum: [
        { name: "A-Gen Power Systems Engineering", img: "a-gen-power-systems.jpg" },
      ],
      goldPeople: [
        { name: "Hon. Glona G. Labadlabad", img: "mayor-glona-g-labadlabad.jpg", fit: "fill" },
        { name: "Stephanie Mae L. Surace", img: "stephanie-mae-l-surace.jpg", fit: "fill" },
      ],
      gold: [
        { name: "Catalina Digital Printing Services", img: "catalina.jpg", fit: "dark" },
        { name: "Nature’s Spring", img: "natures-spring.jpg", fit: "fill" },
        { name: "Anino Studios by Juwan Marco Silva", img: "anino-studios.jpg", fit: "fill" },
        { name: "Linepro Pickleball Outlet", img: "linepro.jpg" },
      ],
      silver: [
        { name: "Ever After Wedding and Events", img: "ever-after-wedding-and-events.jpg" },
        { name: "Blue Dot Shooter’s House", img: "blue-dot-shooters-house.jpg" },
        { name: "Yakap Medical Clinic", img: "yakap-medical-clinic.jpg" },
        { name: "Dexter Regala Construction", img: "dexter-regala-construction.jpg" },
        { name: "R C & A Law & Accounting Firm", img: "rca-law-and-accounting-firm.jpg", fit: "fill" },
        { name: "JDL Auto Electrical Services", img: "jdl-auto-electrical-services.jpg", fit: "fill" },
        { name: "JJLC Security Services Co.", img: "jjlc-security-services.jpg", fit: "fill" },
        { name: "M Lhuillier", img: "m-lhuillier.jpg", fit: "fill" },
        { name: "Ariana Hotel", img: "ariana-hotel.jpg" },
        { name: "Mary Rose Sumalpong / Kyle Joseph B. Magdolot" },
        { name: "Engr. Recarte Bogay" },
        { name: "Ms. Gera Mae Grace Ballos" },
        { name: "Lynlie Ibay" },
        { name: "James Bernard Fabe" },
      ],
      poweredBy: [
        { name: "Paddlestack", img: "paddle-up-events.jpg", fit: "fill", wide: true },
      ],
    };

    const W = 1080, H = 1620;
    const C = { navy900: "#0b1533", navy800: "#101d45", navy700: "#16295c", blue: "#1f6fae", sky: "#45b4e8", sky200: "#a9defa", gold: "#d9a441", silver: "#d4dbe6", white: "#ffffff" };
    const TECH = '"Oxanium", "Montserrat", sans-serif';
    const SANS = '"Montserrat", system-ui, sans-serif';
    const SERIF = '"Playfair Display", Georgia, serif';

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function spaced(ctx, text, x, y, spacing) { // centred text with letter spacing
      if ("letterSpacing" in ctx) {
        ctx.letterSpacing = spacing + "px";
        ctx.fillText(text, x + spacing / 2, y);
        ctx.letterSpacing = "0px";
      } else ctx.fillText(text, x, y);
    }

    function wrap(ctx, text, maxWidth) {
      const lines = [];
      let line = "";
      for (const word of text.split(" ")) {
        const next = line ? line + " " + word : word;
        if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
        else line = next;
      }
      if (line) lines.push(line);
      return lines;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function background(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, C.navy900); g.addColorStop(0.3, C.navy800); g.addColorStop(0.62, C.navy700);
      g.addColorStop(0.88, C.blue); g.addColorStop(1, C.sky);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Halftone dots through the middle, fading out at both ends
      for (let y = 12; y < H; y += 24) {
        const t = y / H;
        const a = t < 0.38 ? (t - 0.08) / 0.3 : t > 0.62 ? (0.94 - t) / 0.32 : 1;
        if (a <= 0) continue;
        ctx.fillStyle = "rgba(8, 16, 42, " + (0.55 * Math.min(1, a)).toFixed(3) + ")";
        for (let x = 12; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 6.2832); ctx.fill(); }
      }

      // The jersey's diagonal panels
      ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
      ctx.beginPath(); ctx.moveTo(760, 0); ctx.lineTo(940, 0); ctx.lineTo(250, H); ctx.lineTo(70, H); ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
      ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(360, 0); ctx.lineTo(1050, H); ctx.lineTo(840, H); ctx.fill();
    }

    // One sponsor tile: a white rounded square (black for "dark" logos) with the logo inside.
    function tile(ctx, s, x, y, w, h, outline) {
      const r = Math.min(w, h) * 0.12;
      ctx.save();
      ctx.shadowColor = "rgba(2, 6, 20, 0.45)"; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
      ctx.fillStyle = s.fit === "dark" ? "#000" : "#fff";
      roundRect(ctx, x, y, w, h, r); ctx.fill();
      ctx.restore();

      if (s.image) {
        const pad = s.fit === "fill" ? 0 : (s.fit === "dark" ? 0.04 : 0.09) * w;
        const bw = w - pad * 2, bh = h - pad * 2;
        const k = (s.fit === "fill" ? Math.max : Math.min)(bw / s.image.naturalWidth, bh / s.image.naturalHeight);
        const iw = s.image.naturalWidth * k, ih = s.image.naturalHeight * k;
        ctx.save();
        roundRect(ctx, x, y, w, h, r); ctx.clip();
        ctx.drawImage(s.image, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
        ctx.restore();
      }
      if (outline) {
        ctx.lineWidth = 3; ctx.strokeStyle = outline;
        roundRect(ctx, x - 5, y - 5, w + 10, h + 10, r + 4); ctx.stroke();
      }
    }

    // A centred row of tiles with each name underneath. Returns the y just below the lowest caption.
    function row(ctx, list, y, size, gap, font, lineHeight, outline) {
      const widths = list.map((s) => s.wide ? size * 2.4 : size);
      const total = widths.reduce((a, b) => a + b, 0) + gap * (list.length - 1);
      let x = (W - total) / 2, bottom = y + size;
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      list.forEach((s, i) => {
        tile(ctx, s, x, y, widths[i], size, outline);
        ctx.font = font; ctx.fillStyle = C.white;
        const lines = wrap(ctx, s.name, Math.max(widths[i] + gap - 10, 150));
        lines.forEach((line, n) => ctx.fillText(line, x + widths[i] / 2, y + size + lineHeight * (n + 1) + 6));
        bottom = Math.max(bottom, y + size + lineHeight * lines.length + 6);
        x += widths[i] + gap;
      });
      return bottom;
    }

    // "Major Tournament Partners  (GOLD)" — the tier name with its pill, centred as a pair.
    function heading(ctx, text, pill, color, y) {
      ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
      ctx.font = "700 25px " + SANS;
      const tw = ctx.measureText(text).width;
      let pw = 0;
      if (pill) { ctx.font = "700 15px " + TECH; pw = ctx.measureText(pill).width + pill.length * 3 + 30; }
      let x = (W - tw - (pill ? pw + 14 : 0)) / 2;
      ctx.font = "700 25px " + SANS; ctx.fillStyle = C.white;
      ctx.fillText(text, x, y);
      if (pill) {
        x += tw + 14;
        ctx.lineWidth = 1.5; ctx.strokeStyle = color;
        roundRect(ctx, x, y - 22, pw, 28, 14); ctx.stroke();
        ctx.font = "700 15px " + TECH; ctx.fillStyle = color; ctx.textAlign = "center";
        spaced(ctx, pill, x + pw / 2 - 1, y - 3, 3);
      }
    }

    function divider(ctx, y) {
      ctx.fillStyle = "rgba(169, 222, 250, 0.2)";
      ctx.fillRect(90, y, W - 180, 1.5);
    }

    function draw(canvas) {
      const ctx = canvas.getContext("2d");
      background(ctx);

      // Club and event
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.white;
      ctx.font = "500 64px " + SERIF;
      ctx.fillText("After 5", W / 2, 84);
      ctx.font = "500 19px " + SANS;
      spaced(ctx, "PICKLEBALL CLUB", W / 2, 118, 9);
      ctx.fillStyle = C.gold; ctx.fillRect(W / 2 - 132, 130, 264, 3);
      ctx.fillStyle = C.white; ctx.font = "700 28px " + TECH;
      spaced(ctx, "1ST OFFICIAL MINI TOURNAMENT", W / 2, 174, 4);
      ctx.fillStyle = C.sky200; ctx.font = "600 18px " + SANS;
      spaced(ctx, "NOVEMBER 15, 2026  •  SUNDAY  •  PICKLEBOY, DIPOLOG CITY", W / 2, 204, 2);

      // Section title
      ctx.fillStyle = C.sky200; ctx.font = "700 36px " + TECH;
      spaced(ctx, "TOURNAMENT PARTNERS", W / 2, 268, 9);
      ctx.fillStyle = C.gold; ctx.fillRect(W / 2 - 34, 282, 68, 3);

      let y = 330;
      heading(ctx, "Title Tournament Partner", "PLATINUM", C.white, y);
      y = row(ctx, TIERS.platinum, y + 24, 146, 420, "600 21px " + SANS, 26, "rgba(255, 255, 255, 0.85)");

      divider(ctx, y + 20);
      y += 58;
      heading(ctx, "Major Tournament Partners", "GOLD", C.gold, y);
      y = row(ctx, TIERS.goldPeople, y + 24, 150, 150, "600 20px " + SANS, 25, "rgba(217, 164, 65, 0.8)");
      y = row(ctx, TIERS.gold, y + 22, 128, 86, "600 17px " + SANS, 22, "rgba(217, 164, 65, 0.8)");

      divider(ctx, y + 20);
      y += 58;
      heading(ctx, "Supporting Tournament Partners", "SILVER", C.silver, y);
      const logos = TIERS.silver.filter((s) => s.img), names = TIERS.silver.filter((s) => !s.img);
      const half = Math.ceil(logos.length / 2);
      y = row(ctx, logos.slice(0, half), y + 22, 100, 74, "600 15px " + SANS, 19);
      y = row(ctx, logos.slice(half), y + 14, 100, 74, "600 15px " + SANS, 19);

      // Sponsors without a logo: names only
      ctx.font = "700 17px " + SANS; ctx.fillStyle = C.white; ctx.textAlign = "center";
      const SEP = "   •   ";
      const lines = [];
      let line = "";
      names.forEach((s) => {
        const next = line ? line + SEP + s.name : s.name;
        if (line && ctx.measureText(next).width > W - 160) { lines.push(line); line = s.name; }
        else line = next;
      });
      if (line) lines.push(line);
      y += 10;
      lines.forEach((l) => { y += 27; ctx.fillText(l, W / 2, y); });

      // Powered By: label, wide logo and name on one line
      divider(ctx, y + 20);
      y += 40;
      const pb = TIERS.poweredBy[0], th = 84, tw = th * 2.4;
      ctx.font = "700 25px " + SANS;
      const lw = ctx.measureText("Powered By").width;
      ctx.font = "600 19px " + SANS;
      const nw = ctx.measureText(pb.name).width;
      let x = (W - lw - 24 - tw - 22 - nw) / 2;
      ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = C.white;
      ctx.font = "700 25px " + SANS;
      ctx.fillText("Powered By", x, y + th / 2);
      tile(ctx, pb, x + lw + 24, y, tw, th);
      ctx.font = "600 19px " + SANS; ctx.fillStyle = C.white; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(pb.name, x + lw + 24 + tw + 22, y + th / 2);
    }

    (async () => {
      const canvas = document.getElementById("poster");
      const save = document.getElementById("save");
      const all = Object.values(TIERS).flat();
      const fonts = ['700 30px "Oxanium"', '500 70px "Playfair Display"', '500 20px "Montserrat"', '600 20px "Montserrat"', '700 25px "Montserrat"'];
      await Promise.all([
        ...all.filter((s) => s.img).map(async (s) => { s.image = await loadImage(DIR + s.img); }),
        document.fonts ? Promise.all(fonts.map((f) => document.fonts.load(f))).catch(() => { }) : null,
      ]);
      draw(canvas);
      save.disabled = false;

      save.addEventListener("click", () => {
        save.disabled = true;
        canvas.toBlob((blob) => {
          save.disabled = false;
          if (!blob) return;
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "after5-tournament-partners.png";
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }, "image/png");
      });
    })();
  </script>
</body>

</html>
